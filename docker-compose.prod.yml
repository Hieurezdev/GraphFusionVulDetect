# Production: https://scanguard.ptitai.org -> host nginx -> frontend (127.0.0.1:18510) -> /api -> backend.
services:
  backend:
    build:
      context: .
      dockerfile: docker/be.prod.dockerfile
    env_file: .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=graphfusion
      - HF_HOME=/hf-cache
      - DEVICE=cuda
    volumes:
      - hf_cache:/hf-cache
      - storage:/graphfusion/storage  # uploaded contracts; the fix check re-reads them
      - models:/graphfusion/models    # models/registry.json + retrained checkpoints: must survive a rebuild
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/fe.prod.dockerfile
      args:
        - VITE_API_BASE_URL=https://scanguard.ptitai.org
    ports:
      - "127.0.0.1:18510:8080"
    depends_on:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
  hf_cache:
  storage:
  models:
