services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/be.dockerfile
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017/graphfusion
      MONGODB_DATABASE: graphfusion
      GRAPH_VUL_MODEL_PATH: /graphfusion/models/best_model_GCN_2L_max.pt
      NODE_VUL_MODEL_PATH: /graphfusion/models/best_node_classifier_model.pt
      HF_HOME: /graphfusion/storage/huggingface
      DGLBACKEND: pytorch
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - app_storage:/graphfusion/storage
      - ./src/infrastructure/analysis_model:/graphfusion/models:ro
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
  frontend:
    build:
      context: .
      dockerfile: docker/fe.dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 3
  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  app_storage:
  mongodb_data:
