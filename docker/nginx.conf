# Rate limits (http context: this file is included into nginx's http block).
# Only the host nginx can reach this container (127.0.0.1:18510) and it sets X-Real-IP to the real client.
map $http_x_real_ip $client_ip { "" $remote_addr; default $http_x_real_ip; }
# An empty key is not counted, so each zone only applies to its own paths.
map $uri $auth_key  { ~^/api/v1/auth/(login|register|change-password)$ $client_ip; default ""; }
map $uri $heavy_key { ~^/api/v1/(analyze$|refactor/|token/) $client_ip; default ""; }  # GPU, Slither, LLM, explorer quota
limit_req_zone $auth_key  zone=auth:10m  rate=10r/m;
limit_req_zone $heavy_key zone=heavy:10m rate=20r/m;
limit_req_zone $client_ip zone=api:10m   rate=20r/s;

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        
        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Step 2.5: scripts only from this site (no inline or remote script can run even if markup gets injected);
        # Google Fonts for the typefaces, blob: workers for the Monaco editor, inline styles for Monaco and Tailwind,
        # token logos from CoinGecko's image hosts and the account avatars from DiceBear.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://coin-images.coingecko.com https://assets.coingecko.com https://api.dicebear.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # keep the https set by the host nginx
        # Analysis results stream (SSE) and model inference can take minutes.
        limit_req zone=auth burst=5 nodelay;
        limit_req zone=heavy burst=10 nodelay;
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 25m;

        # Handle CORS if needed
        proxy_set_header Access-Control-Allow-Origin *;
        proxy_set_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        proxy_set_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
    }

    # Optimize static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}
